{% extends "base.html" %}
{% import "macros.html" as m %}
{% block content %}
<div class="view">
  <div class="section-head"><div><h2>Turmas</h2><p>{{ d.turmas|length }} turmas ativas na unidade</p></div></div>
  <div class="card">
    <div class="table-wrap"><table>
      <thead><tr><th>Turma</th><th>Turno</th><th>Alunos</th><th>Ocupação</th></tr></thead>
      <tbody>
        {% for t in d.turmas %}
        <tr>
          <td>{{ t.nome }}</td><td>{{ t.turno }}</td><td class="mono">{{ t.alunos }}</td>
          <td style="min-width:160px">{{ m.bar(t.ocupacao) }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table></div>
  </div>
</div>
{% endblock %}
